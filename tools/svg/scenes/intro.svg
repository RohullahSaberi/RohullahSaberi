<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Software engineering illustration with connected web and desktop applications</title>
  <desc id="desc">Original illustrated profile artwork with slow CSS animations. Respects reduced motion.</desc>
  <!-- SHARED_STYLE -->
  <rect x="1" y="1" width="1198" height="358" rx="22" class="canvas" />
