<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
    <title id="title">Software engineering illustration with connected web and desktop applications</title><desc id="desc">Original illustrated profile artwork with slow CSS animations. Respects reduced motion.</desc>
    <style>svg{--bg:#eef4fb;--panel:#f8fbff;--ink:#17263a;--muted:#4b6078;--line:#cbd9e8;--blue:#285f9e;--soft:#dce9f8;--cyan:#387f91;--warm:#b85216;font-family:Arial,Helvetica,sans-serif}
    .panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.soft{fill:var(--soft)}
    .outlined{stroke:var(--line);stroke-width:1.5}.line,.rule,.connector,.packet,.wave,.check,.shield,.spark{fill:none;stroke-linecap:round;stroke-linejoin:round}
    .line{stroke:var(--blue);stroke-width:2.3}.rule{stroke:var(--line);stroke-width:2}
    .connector{stroke:var(--line);stroke-width:2;stroke-dasharray:3 9}
    .packet{stroke:var(--cyan);stroke-width:3;stroke-dasharray:12 88;animation:travel 12s linear infinite}
    .ink{fill:var(--ink)}.muted{fill:var(--muted)}.accent{fill:var(--blue)}.blue-fill,.dot,.bar{fill:var(--blue)}
    .cyan{fill:var(--cyan)}.warm{fill:var(--warm)}.on-blue{fill:var(--panel)}
    .halo{fill:var(--soft);opacity:.7}.warm-halo{fill:var(--warm);opacity:.07}
    .wave{stroke:var(--cyan);stroke-width:1.6;opacity:.26;animation:wave 16s ease-in-out infinite}.second{opacity:.13;animation-delay:-8s}
    .float{animation:float 8s ease-in-out infinite}.float-slow{animation:float 11s ease-in-out infinite}
    .pulse{animation:pulse 6s ease-in-out infinite}.bar{transform-box:fill-box;transform-origin:center bottom;animation:bar 10s ease-in-out infinite}
    .bubble{fill:none;stroke:var(--line);stroke-width:1.5}.scan{stroke:var(--warm);stroke-width:2.5}
    .scanner{animation:scan 12s ease-in-out infinite}.check{stroke:var(--cyan);stroke-width:4;stroke-dasharray:100;animation:check 12s ease-in-out infinite}
    .shield{stroke:var(--blue);stroke-width:2.4}.spark{stroke:var(--cyan);stroke-width:2;animation:pulse 9s ease-in-out infinite}
    @keyframes travel{from{stroke-dashoffset:100}to{stroke-dashoffset:-100}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes wave{50%{transform:translate(0,-9px)}}
    @keyframes pulse{50%{opacity:.55}}
    @keyframes bar{50%{transform:scaleY(.82)}}
    @keyframes scan{0%,15%,100%{transform:translateY(0);opacity:.3}50%,75%{transform:translateY(78px);opacity:1}}
    @keyframes check{0%,10%{stroke-dashoffset:100}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:100}}
    @media(prefers-reduced-motion:reduce){.motion{animation:none!important}.scanner{transform:translateY(48px)}.check{stroke-dashoffset:0}}
    </style>
    <rect x="1" y="1" width="1198" height="358" rx="22" fill="#eef4fb" stroke="#cbd9e8"/>
    <circle cx="711" cy="166" r="137" class="halo"/><circle cx="919" cy="198" r="78" class="halo warm-halo"/><path d="M45 296C267 211 332 343 516 273S826 339 1153 170" class="wave motion" /><path d="M33 315C261 230 349 363 530 290S827 357 1166 190" class="wave second motion" /><rect x="48" y="48" width="198" height="42" rx="21" class="soft" /><text x="68" y="75" font-size="12" class="muted" letter-spacing="1.4">SOFTWARE ENGINEER</text><text x="48" y="148" font-size="43" class="ink" font-weight="700">Ideas into</text><text x="48" y="201" font-size="43" class="ink" font-weight="700">working software.</text><text x="50" y="243" font-size="13" class="muted" letter-spacing="2.2">WEB  /  DESKTOP  /  PRODUCT</text><g class="float motion"><rect x="601" y="177" width="242" height="127" rx="12" class="panel" /><rect x="611" y="187" width="222" height="24" rx="7" class="soft" /><circle cx="623" cy="199" r="3" class="dot" /><circle cx="635" cy="199" r="3" class="cyan" /><circle cx="647" cy="199" r="3" class="warm" /><path d="M611 220h222" class="rule" /><text x="623" y="258" font-size="32" class="accent" >{</text><rect x="652" y="238" width="64" height="5" rx="2" class="blue-fill" /><rect x="652" y="256" width="88" height="5" rx="2" class="soft" /><rect x="652" y="274" width="50" height="5" rx="2" class="blue-fill" /><text x="811" y="285" font-size="28" class="accent" >}</text><path d="M584 310h276l-18 10H601Z" class="soft outlined" /></g><g class="float-slow motion"><rect x="891" y="51" width="191" height="131" rx="12" class="panel" /><rect x="901" y="61" width="171" height="24" rx="7" class="soft" /><circle cx="913" cy="73" r="3" class="dot" /><circle cx="925" cy="73" r="3" class="cyan" /><circle cx="937" cy="73" r="3" class="warm" /><path d="M901 94h171" class="rule" /><rect x="905" y="105" width="163" height="31" rx="7" class="soft" /><rect x="905" y="145" width="77.5" height="23" rx="7" class="soft" /><rect x="990.5" y="145" width="77.5" height="23" rx="7" class="soft" /></g><g class="float motion" style="animation-delay:-3s"><g transform="translate(1005 211) scale(0.72)"><rect x="0" y="0" width="108" height="144" rx="12" class="panel" /><path d="M17 20h65M17 125h73" class="rule" /><circle cx="22" cy="43" r="4" class="bubble" /><circle cx="43" cy="43" r="4" class="blue-fill" /><circle cx="64" cy="43" r="4" class="bubble" /><circle cx="85" cy="43" r="4" class="bubble" /><circle cx="22" cy="63" r="4" class="bubble" /><circle cx="43" cy="63" r="4" class="bubble" /><circle cx="64" cy="63" r="4" class="bubble" /><circle cx="85" cy="63" r="4" class="blue-fill" /><circle cx="22" cy="83" r="4" class="blue-fill" /><circle cx="43" cy="83" r="4" class="bubble" /><circle cx="64" cy="83" r="4" class="bubble" /><circle cx="85" cy="83" r="4" class="bubble" /><circle cx="22" cy="103" r="4" class="bubble" /><circle cx="43" cy="103" r="4" class="bubble" /><circle cx="64" cy="103" r="4" class="blue-fill" /><circle cx="85" cy="103" r="4" class="bubble" /><g class="scanner motion"><path d="M10 36h88" class="scan" /></g></g></g><g class="float-slow motion" style="animation-delay:-2s"><rect x="502" y="68" width="84" height="64" rx="0" class="panel" /><ellipse cx="544" cy="132" rx="42" ry="12" class="panel"/><path d="M502 90c0 16 84 16 84 0M502 111c0 16 84 16 84 0" class="rule" /><ellipse cx="544" cy="68" rx="42" ry="12" class="soft outlined"/></g><path d="M588 104H617Q638 104 638 130V168" class="connector" /><path d="M588 104H617Q638 104 638 130V168" class="packet motion" pathLength="100" style="animation-delay:0s"/><path d="M851 229H871Q888 229 888 210V187" class="connector" /><path d="M851 229H871Q888 229 888 210V187" class="packet motion" pathLength="100" style="animation-delay:-4s"/><circle cx="921" cy="70" r="4" class="warm pulse motion" /><path d="M1130 90v16M1122 98h16" class="spark motion" />
    </svg>