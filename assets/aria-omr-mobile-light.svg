<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc">
  <title id="title">Answer-sheet scanning, processing and result reporting</title>
  <desc id="desc">Original illustrated profile artwork with slow CSS animations. Respects reduced motion.</desc>
  <style>
    svg{--bg:#eef4fb;--panel:#f8fbff;--ink:#17263a;--muted:#4b6078;--line:#cbd9e8;--blue:#285f9e;--soft:#dce9f8;--cyan:#387f91;--warm:#b85216}
    .canvas{fill:var(--bg);stroke:var(--line)}
    svg{font-family:Arial,Helvetica,sans-serif}
    .panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.soft{fill:var(--soft)}
    .outlined{stroke:var(--line);stroke-width:1.5}.line,.rule,.connector,.packet,.wave,.check,.shield,.spark{fill:none;stroke-linecap:round;stroke-linejoin:round}
    .line{stroke:var(--blue);stroke-width:2.3}.rule{stroke:var(--line);stroke-width:2}
    .connector{stroke:var(--line);stroke-width:2;stroke-dasharray:3 9}
    .packet{stroke:var(--cyan);stroke-width:3;stroke-dasharray:12 88;animation:travel 12s linear infinite}
    .ink{fill:var(--ink)}.muted{fill:var(--muted)}.accent{fill:var(--blue)}.blue-fill,.dot,.bar{fill:var(--blue)}
    .cyan{fill:var(--cyan)}.warm{fill:var(--warm)}.on-blue{fill:var(--panel)}
    .halo{fill:var(--soft);opacity:.7}.warm-halo{fill:var(--warm);opacity:.07}
    .wave{stroke:var(--cyan);stroke-width:1.6;opacity:.26;animation:wave 16s ease-in-out infinite}.second{opacity:.13;animation-delay:-8s}
    .float{animation:float 8s ease-in-out infinite}.float-slow{animation:float 11s ease-in-out infinite}
    .pulse{animation:pulse 6s ease-in-out infinite}.bar{transform-box:fill-box;transform-origin:center bottom;animation:bar 10s ease-in-out infinite}
    .bubble{fill:none;stroke:var(--line);stroke-width:1.5}.scan{stroke:var(--warm);stroke-width:2.5}
    .scanner{animation:scan 12s ease-in-out infinite}.check{stroke:var(--cyan);stroke-width:4;stroke-dasharray:100;animation:check 12s ease-in-out infinite}
    .shield{stroke:var(--blue);stroke-width:2.4}.spark{stroke:var(--cyan);stroke-width:2;animation:pulse 9s ease-in-out infinite}
    @keyframes travel{from{stroke-dashoffset:100}to{stroke-dashoffset:-100}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes wave{50%{transform:translate(0,-9px)}}
    @keyframes pulse{50%{opacity:.55}}
    @keyframes bar{50%{transform:scaleY(.82)}}
    @keyframes scan{0%,15%,100%{transform:translateY(0);opacity:.3}50%,75%{transform:translateY(78px);opacity:1}}
    @keyframes check{0%,10%{stroke-dashoffset:100}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:100}}
    @media(prefers-reduced-motion:reduce){.motion{animation:none!important}.scanner{transform:translateY(48px)}.check{stroke-dashoffset:0}}
  </style>
  <rect x="1" y="1" width="598" height="298" rx="22" class="canvas" />
  <circle cx="99" cy="138" r="105" class="halo" />
  <path d="M145 131H200" class="connector" />
<path d="M145 131H200" class="packet motion" pathLength="100" style="animation-delay:0s" />
  <path d="M347 131H404" class="connector" />
<path d="M347 131H404" class="packet motion" pathLength="100" style="animation-delay:-3s" />
  <g transform="translate(-18.3 22.04) scale(0.94)" id="answer-sheet">
    <g transform="translate(45 34) scale(1.12)">
      <rect x="0" y="0" width="108" height="144" rx="12" class="panel" />
      <path d="M17 20h65M17 125h73" class="rule" />
      <circle cx="22" cy="43" r="4" class="bubble" />
      <circle cx="43" cy="43" r="4" class="blue-fill" />
      <circle cx="64" cy="43" r="4" class="bubble" />
      <circle cx="85" cy="43" r="4" class="bubble" />
      <circle cx="22" cy="63" r="4" class="bubble" />
      <circle cx="43" cy="63" r="4" class="bubble" />
      <circle cx="64" cy="63" r="4" class="bubble" />
      <circle cx="85" cy="63" r="4" class="blue-fill" />
      <circle cx="22" cy="83" r="4" class="blue-fill" />
      <circle cx="43" cy="83" r="4" class="bubble" />
      <circle cx="64" cy="83" r="4" class="bubble" />
      <circle cx="85" cy="83" r="4" class="bubble" />
      <circle cx="22" cy="103" r="4" class="bubble" />
      <circle cx="43" cy="103" r="4" class="bubble" />
      <circle cx="64" cy="103" r="4" class="blue-fill" />
      <circle cx="85" cy="103" r="4" class="bubble" />
      <g class="scanner motion">
        <path d="M10 36h88" class="scan" />
      </g>
    </g>
  </g>
  <g transform="translate(-107 18) scale(1)" id="scanner">
    <g>
      <rect x="313" y="67" width="135" height="93" rx="17" class="panel" />
      <rect x="330" y="86" width="100" height="12" rx="6" class="soft" />
      <path d="M341 126h43" class="line" />
      <circle cx="424" cy="145" r="4" class="warm pulse motion" />
    </g>
  </g>
  <g transform="translate(-54.4 17.6) scale(0.8)" id="report">
    <rect x="583" y="38" width="205" height="148" rx="12" class="panel" />
    <rect x="593" y="48" width="185" height="24" rx="7" class="soft" />
    <circle cx="605" cy="60" r="3" class="dot" />
    <circle cx="617" cy="60" r="3" class="cyan" />
    <circle cx="629" cy="60" r="3" class="warm" />
    <path d="M593 81h185" class="rule" />
    <rect x="597" y="90" width="32" height="82" rx="6" class="soft" />
    <path d="M604 104h18" class="rule" />
    <path d="M604 120h18" class="rule" />
    <path d="M604 136h18" class="rule" />
    <rect x="643" y="147" width="14" height="24" rx="4" class="bar motion" style="animation-delay:0.0s" />
    <rect x="668" y="129" width="14" height="42" rx="4" class="bar motion" style="animation-delay:-1.1s" />
    <rect x="693" y="106" width="14" height="65" rx="4" class="bar motion" style="animation-delay:-2.2s" />
    <rect x="718" y="121" width="14" height="50" rx="4" class="bar motion" style="animation-delay:-3.3000000000000003s" />
  </g>
  <g transform="translate(81.2 132.2) scale(0.52)" id="result">
    <rect x="865" y="65" width="92" height="92" rx="20" class="soft" />
    <path d="M886 111l18 18 33-41" class="check motion" />
  </g>
  <text x="81" y="258" font-size="26" text-anchor="middle" class="ink" >Scan</text>
  <text x="273.5" y="258" font-size="26" text-anchor="middle" class="ink" >Process</text>
  <text x="494" y="258" font-size="26" text-anchor="middle" class="ink" >Report</text>
</svg>
